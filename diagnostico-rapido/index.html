<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Diagnóstico rápido · Grupo 2!H</title>
<meta name="description" content="Responda 6 perguntas rápidas sobre a sua empresa e receba o próximo passo certo da 2!H para crescer com estrutura e previsibilidade.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/general-sans-600.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-var-latin.woff2" crossorigin>
<style>
@font-face{font-family:'General Sans';font-weight:500;font-display:swap;src:url(assets/fonts/general-sans-500.woff2) format('woff2')}
@font-face{font-family:'General Sans';font-weight:600;font-display:swap;src:url(assets/fonts/general-sans-600.woff2) format('woff2')}
@font-face{font-family:'General Sans';font-weight:700;font-display:swap;src:url(assets/fonts/general-sans-700.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:100 900;font-display:swap;src:url(assets/fonts/inter-var-latin.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:100 900;font-display:swap;src:url(assets/fonts/inter-var-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+20A0-20C0}
:root{--bg0:#0A0A0C;--bg1:#0F0F12;--ink:#121215;--gold:#F5C328;--gold2:#FFD34F;--text:#F3F2EE;--muted:#A5A39A;--line:rgba(243,242,238,.1);--ease:cubic-bezier(.22,.9,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0)}
body{color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
::selection{background:rgba(245,195,40,.28)}
.bg{position:fixed;inset:0;pointer-events:none}
.bg::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(243,242,238,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(243,242,238,.03) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(80% 70% at 50% 30%,#000 20%,transparent 100%);-webkit-mask-image:radial-gradient(80% 70% at 50% 30%,#000 20%,transparent 100%)}

/* ---- janela do chat: tela cheia no celular, cartão central no desktop ---- */
.app{position:relative;display:flex;flex-direction:column;width:100%;max-width:560px;height:100dvh;margin:0 auto;background:linear-gradient(180deg,rgba(18,17,15,.9),rgba(10,10,12,.96)),#0C0C0E}
@media (min-width:700px) and (min-height:640px){
.app{height:min(860px,calc(100dvh - 48px));margin-top:24px;border-radius:28px;border:1px solid rgba(245,195,40,.2);box-shadow:0 50px 100px -40px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
}

/* cabeçalho */
.head{flex:none;display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);background:rgba(12,12,14,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.avatar{position:relative;flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(245,195,40,.45);background:radial-gradient(circle at 50% 20%,#2a2418,#121110 60%,#0a0a0c)}
.avatar img{width:24px;height:auto;display:block}
.avatar i{position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:#2ECC71;border:2px solid #0d0d0f}
.head-txt{min-width:0;flex:1}
.head-txt b{display:block;font:700 15px/1.2 'General Sans',Inter,sans-serif;letter-spacing:-.01em}
.head-txt>span{display:block;margin-top:2px;font:500 12.5px/1.2 Inter,sans-serif;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid rgba(245,195,40,.55);background:linear-gradient(160deg,#2c2414,#15130f);box-shadow:0 8px 20px -12px rgba(245,195,40,.6),inset 0 1px 0 rgba(255,239,192,.14);font:700 13.5px/1 'General Sans',Inter,sans-serif;color:var(--gold2);cursor:pointer;transition:border-color .25s,box-shadow .25s,transform .2s var(--ease),opacity .25s}
.back i{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFE28A,#F5C328 45%,#D9A012);color:var(--ink);font-style:normal;transition:transform .25s var(--ease)}
.back svg{width:16px;height:16px}
@media (hover:hover){.back:hover{border-color:var(--gold);box-shadow:0 12px 26px -12px rgba(245,195,40,.85)}.back:hover i{transform:translateX(-2px)}}
.back:active{transform:scale(.96)}
@media (max-width:340px){.back{padding-right:6px}.back span{display:none}}
.back[hidden]{display:flex;opacity:0;pointer-events:none}
.progress{flex:none;height:3px;background:rgba(243,242,238,.06)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#B8830A,#F5C328,#FFE28A);box-shadow:0 0 10px rgba(245,195,40,.6);transition:width .5s var(--ease)}

/* mensagens */
.msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:20px 16px 12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:rgba(245,195,40,.3) transparent}
.msg{max-width:86%;padding:12px 15px;border-radius:18px;font:500 15.5px/1.5 Inter,sans-serif;text-wrap:pretty;animation:pop .35s var(--ease) both}
.msg.bot{align-self:flex-start;border-top-left-radius:6px;background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid var(--line);color:var(--text)}
.msg.user{align-self:flex-end;border-top-right-radius:6px;background:linear-gradient(135deg,#FFE28A,#F5C328 45%,#E2AA14);color:var(--ink);font-weight:600}
.msg.note{align-self:center;max-width:100%;padding:6px 12px;border-radius:999px;font-size:12px;color:var(--muted);background:rgba(243,242,238,.04);border:1px solid var(--line)}
.msg.static{animation:none}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;border-radius:18px;border-top-left-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.4;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* área de resposta (fixa embaixo) */
.dock{flex:none;padding:12px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(12,12,14,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dock:empty{display:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.one{grid-template-columns:1fr}
/* dica para quem não sabe onde tocar */
.hint{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 10px;font:800 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
.hint svg{width:16px;height:16px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
/* botões de resposta: cartão dourado com ícone, texto e seta */
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:60px;padding:9px 10px 9px 9px;border-radius:16px;border:1.5px solid rgba(245,195,40,.6);background:linear-gradient(160deg,#2c2414 0%,#191510 55%,#121110 100%);box-shadow:0 12px 26px -14px rgba(245,195,40,.6),inset 0 1px 0 rgba(255,239,192,.14);text-align:left;color:#fff;cursor:pointer;overflow:hidden;isolation:isolate;transition:transform .22s var(--ease),border-color .22s,box-shadow .22s,background .22s,opacity .25s;animation:pop .4s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.opt::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(115deg,transparent,rgba(255,239,192,.22),transparent);transform:skewX(-18deg);animation:opt-sheen 3.6s cubic-bezier(.2,.7,.2,1) infinite;animation-delay:calc(var(--i,0)*.35s + 1s);pointer-events:none;z-index:-1}
@keyframes opt-sheen{0%,70%{left:-70%}100%{left:140%}}
.oi{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFE28A,#F5C328 45%,#D9A012);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px -6px rgba(245,195,40,.8)}
.oi svg{width:21px;height:21px}
.ot{flex:1;min-width:0;font:600 15px/1.3 'General Sans',Inter,sans-serif;letter-spacing:-.005em}
.oa{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(245,195,40,.6);color:var(--gold);transition:background .22s,color .22s,transform .22s var(--ease)}
.oa svg{width:15px;height:15px}
@media (hover:hover){.opt:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 18px 34px -14px rgba(245,195,40,.8),inset 0 1px 0 rgba(255,239,192,.2);background:linear-gradient(160deg,#3a2f17 0%,#211b11 55%,#151310 100%)}.opt:hover .oa{background:var(--gold);color:var(--ink);transform:translateX(2px)}}
.opt:active{transform:scale(.97)}
/* resposta escolhida: acende em dourado e as outras somem */
.opt.picked{background:linear-gradient(135deg,#FFE28A,#F5C328 45%,#E2AA14);border-color:#FFE28A;color:var(--ink);transform:scale(1.02)}
.opt.picked .oi{background:var(--ink);color:var(--gold)}
.opt.picked .oa{background:var(--ink);border-color:var(--ink);color:var(--gold)}
.opts.has-pick .opt:not(.picked){opacity:.3;transform:scale(.98)}
.opt:focus-visible,.back:focus-visible,.send:focus-visible,.field input:focus-visible,.alt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}

.form{display:flex;flex-direction:column;gap:10px}
.field{position:relative}
.field label{display:block;margin:0 0 6px 4px;font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;height:52px;padding:0 16px;border-radius:14px;border:1px solid rgba(243,242,238,.16);background:rgba(243,242,238,.05);font-size:16px;outline:none;transition:border-color .2s,background .2s}
.field input:focus{border-color:rgba(245,195,40,.6);background:rgba(245,195,40,.05)}
.field input[aria-invalid=true]{border-color:#FF6B4A}
.err{min-height:16px;margin:4px 0 0 4px;font:500 12.5px/1.3 Inter,sans-serif;color:#FF9A82}
.send{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:999px;background:linear-gradient(135deg,#FFE28A,#F5C328 38%,#E2AA14);color:var(--ink);font:700 16px/1 'General Sans',Inter,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 30px -12px rgba(245,195,40,.7);transition:transform .2s var(--ease),opacity .2s}
a.send{height:auto;min-height:56px;padding:12px 22px;text-align:center;line-height:1.25;text-decoration:none}
.send:active{transform:scale(.98)}
.send[disabled]{opacity:.6;cursor:wait}
.send svg{width:18px;height:18px}
.legal{margin:2px 4px 0;font:500 11.5px/1.45 Inter,sans-serif;color:#8b897f;text-align:center}
.alt{display:block;width:100%;margin-top:8px;padding:10px;border:0;background:none;font:600 13.5px/1 Inter,sans-serif;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.alt:hover{color:var(--gold)}
a.send{text-decoration:none}

/* resultado */
.result{align-self:stretch;max-width:100%;margin-top:6px;padding:18px;border-radius:20px;border:1px solid rgba(245,195,40,.4);background:radial-gradient(100% 80% at 0% 0%,rgba(245,195,40,.16),transparent 60%),rgba(255,255,255,.03);animation:pop .4s var(--ease) both}
.result .tag{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;font:800 10.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(135deg,#FFE28A,#F5C328 45%,#D9A012);color:var(--ink)}
.result p{margin:12px 0 0;font:500 16px/1.5 'General Sans',Inter,sans-serif;color:var(--text);text-wrap:pretty}
.result.out{border-color:rgba(243,242,238,.18);background:rgba(255,255,255,.03)}
.result.out .tag{background:rgba(243,242,238,.1);color:var(--text)}

.sub-short{display:none}
@media (max-width:480px){.sub-full{display:none}.sub-short{display:inline}}
/* telas baixas: celular deitado ou teclado aberto */
@media (max-height:560px){
.head{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:8px}
.avatar{width:38px;height:38px}
.msgs{padding-top:12px}
.dock{padding-top:10px}
.form{gap:8px}
.field label{display:none}
.field input{height:46px}
.err:empty{display:none}
.err{min-height:0}
.send{height:50px}
.legal{font-size:11px}
.opt{min-height:50px;padding:6px 8px 6px 6px;gap:10px}
.oi{width:34px;height:34px;border-radius:10px}
.oi svg{width:18px;height:18px}
.hint{margin-bottom:8px}
}
@media (max-height:560px) and (min-width:560px){
.form{display:grid;grid-template-columns:1fr 1fr;align-items:start}
.send,.legal{grid-column:1/-1}
.opts{grid-template-columns:1fr 1fr}
.opts.one{grid-template-columns:1fr 1fr}
}
/* muito baixas: a página inteira rola, em vez de espremer as mensagens */
@media (max-height:480px){
body{overflow:auto}
.app{height:auto;min-height:100dvh}
.msgs{flex:none;overflow:visible}
}
@media (max-width:360px){.msg{font-size:15px;max-width:90%}.ot{font-size:14.5px}.oa{width:26px;height:26px}.head{gap:10px;padding-left:12px;padding-right:12px}.msgs,.dock{padding-left:12px;padding-right:12px}}
@media (prefers-reduced-motion:reduce){.msg,.opt,.result,.opt::after,.hint svg{animation:none}.typing i{animation:none;opacity:.7}.progress i{transition:none}}
.legal a{color:var(--gold);text-decoration:underline;text-underline-offset:2px}
/* >>> PADRAO-PROTECAO */
/* ===== PROTEÇÃO DE CONTEÚDO =====
   Texto não seleciona, imagem não arrasta nem abre "salvar imagem" no toque longo do celular.
   Campos de formulário continuam normais (digitar, selecionar, colar). */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]:not([contenteditable="false"]),[contenteditable]:not([contenteditable="false"]) *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg,picture,video,canvas{-webkit-user-drag:none;user-drag:none}
/* <<< PADRAO-PROTECAO */
</style>
</head>
<body>
<div class="bg"></div>

<main class="app" aria-label="Diagnóstico rápido da 2!H">
<header class="head">
<span class="avatar"><img src="assets/logo-2h.png" alt="" width="140" height="129"><i></i></span>
<div class="head-txt"><b>Grupo 2!H</b><span id="sub"><span class="sub-full">Diagnóstico rápido · menos de 1 minuto</span><span class="sub-short">Diagnóstico rápido · 1 min</span></span></div>
<button class="back" id="back" type="button" aria-label="Voltar uma pergunta" hidden><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></i><span>Voltar</span></button>
</header>
<div class="progress" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
<section class="msgs" id="msgs" aria-live="polite"></section>
<div class="dock" id="dock"></div>
</main>

<script>
/* =====================================================================
   CONFIGURAÇÃO — preencher antes de publicar
   ===================================================================== */
const CONFIG = {
  // Webhook do n8n (o mesmo da ficha, do Diagnóstico Estratégico e dos 7 sinais).
  // O parâmetro source separa os fluxos dentro do n8n. O workflow precisa estar ATIVO.
  WEBHOOK_URL: "https://n8n-n8n-start.dnjlb7.easypanel.host/webhook/grupo2h?source=diagnostico-rapido",
  // Para onde vai quem ainda não está no momento de um projeto ("FORA DO ICP"). Vazio = sem botão.
  CONTENT_URL: "/novo/blog/antes-de-escalar-o-trafego-5-perguntas/",
  CONTENT_LABEL: "Ler: 5 perguntas antes de investir em tráfego",
  // WhatsApp oficial da 2!H (o mesmo do site). O lead QUALIFICADO ganha o botão para adiantar a conversa.
  WHATSAPP_COMERCIAL: "5515997509239"
};

/* ---- roteiro: 6 perguntas pensadas para empresas que já faturam e investem ---- */
const INTRO = "Olá! Aqui é a 2!H. Em 6 perguntas rápidas eu entendo o momento da sua empresa e te indico o próximo passo certo. Leva menos de 1 minuto.";
const STEPS = [
  { id: "cargo", q: "Para começar: qual é a sua posição na empresa?",
    opts: ["Sócio ou CEO", "Diretor ou gerente (marketing ou comercial)", "Coordenador ou analista", "Outro"] },
  { id: "segmento", q: "Em qual mercado a sua empresa atua?",
    opts: ["Serviços B2B (indústria, tecnologia, consultoria)", "Saúde (clínicas, hospitais, laboratórios)", "Varejo, e-commerce ou franquia", "Educação, infoproduto ou outro"] },
  { id: "faturamento", q: "Qual o faturamento médio mensal da empresa?",
    opts: ["Até R$ 50 mil", "R$ 50 mil a R$ 200 mil", "R$ 200 mil a R$ 1 milhão", "Acima de R$ 1 milhão"] },
  { id: "investe", q: "Quanto a empresa investe por mês em mídia paga hoje?",
    opts: ["Mais de R$ 10 mil por mês", "Até R$ 10 mil por mês", "Ainda não investimos"], one: true },
  { id: "transparencia", q: "Hoje você enxerga com clareza quanto cada real investido volta em vendas?",
    opts: ["Sim, acompanho os números de perto", "Em parte, mas não confio totalmente", "Não, é a nossa maior frustração"], one: true,
    // quem ainda não investe pula esta pergunta (registrada como "Não se aplica")
    skip: a => a.investe === "Ainda não investimos", skipValue: "Não se aplica" },
  { id: "gargalo", q: "Onde está o principal gargalo de crescimento hoje?",
    opts: ["Volume: não geramos leads suficientes", "Conversão: o lead chega e não vira venda", "Controle: não sabemos o que dá retorno", "Estrutura: falta base para escalar com segurança"], one: true },
  { id: "contato", q: "Perfeito. Para eu te enviar o próximo passo, me passe seus dados.", form: true }
];
const PAIN = ["Em parte, mas não confio totalmente", "Não, é a nossa maior frustração"];
const GRANDE = ["R$ 200 mil a R$ 1 milhão", "Acima de R$ 1 milhão"];

/* ---- classificação para o comercial ---- */
function classify(a) {
  if (a.faturamento === "Até R$ 50 mil") return a.investe === "Ainda não investimos" ? "FORA DO ICP" : "ANALISAR";
  if (GRANDE.includes(a.faturamento)) return "QUALIFICADO";
  // R$ 50 mil a R$ 200 mil: qualificado quando já investe forte ou sente a dor de não ver o retorno
  if (a.investe === "Mais de R$ 10 mil por mês" || PAIN.includes(a.transparencia)) return "QUALIFICADO";
  return "ANALISAR";
}
/* prioridade ALTA: empresa grande, ou acima de R$ 200 mil com quem decide respondendo */
function prioridade(a) {
  if (a.faturamento === "Acima de R$ 1 milhão") return "ALTA";
  if (GRANDE.includes(a.faturamento) && a.cargo === "Sócio ou CEO") return "ALTA";
  return classify(a) === "QUALIFICADO" ? "MÉDIA" : "NORMAL";
}
const FINAL = {
  "QUALIFICADO": { tag: "Próximo passo", text: n => n + ", o seu cenário tem exatamente o perfil que a 2!H atende. Um especialista vai te chamar no WhatsApp para agendar a conversa de diagnóstico, com os números da sua operação na mesa." },
  "FORA DO ICP": { tag: "Por enquanto", out: true, text: n => n + ", hoje o melhor passo para a sua empresa é estruturar a base antes de investir em mídia. Separamos um conteúdo gratuito que mostra por onde começar." },
  "ANALISAR":    { tag: "Recebido", text: n => "Obrigado, " + n + ". Um especialista da 2!H vai analisar o seu cenário e te chamar no WhatsApp com o próximo passo." }
};

/* ---- origem do lead (UTM) ---- */
const UTM_KEYS = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"];
const origin = (() => {
  const p = new URLSearchParams(location.search), o = {};
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem("2h_utm") || "{}"); } catch (_) {}
  UTM_KEYS.concat("origem").forEach(k => { o[k] = p.get(k) || saved[k] || ""; });
  try { sessionStorage.setItem("2h_utm", JSON.stringify(o)); } catch (_) {}
  o.referrer = document.referrer || "";
  return o;
})();

/* ---- estado ---- */
const REDUCED = matchMedia("(prefers-reduced-motion:reduce)").matches;
const $msgs = document.getElementById("msgs"), $dock = document.getElementById("dock");
const $bar = document.getElementById("bar"), $back = document.getElementById("back");
let answers = {}, done = false, busy = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const firstName = n => (n || "").trim().split(/\s+/)[0];
const scrollDown = () => requestAnimationFrame(() => {
  $msgs.scrollTop = $msgs.scrollHeight;
  // em telas muito baixas a página inteira rola (ver CSS max-height:480px)
  if (document.documentElement.scrollHeight > innerHeight) scrollTo(0, document.documentElement.scrollHeight);
});
const wait = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));

function addMsg(text, from, isStatic) {
  const d = document.createElement("div");
  d.className = "msg " + from + (isStatic ? " static" : "");
  d.textContent = text;
  $msgs.appendChild(d);
  scrollDown();
  return d;
}
async function botSays(text) {
  const t = document.createElement("div");
  t.className = "typing"; t.setAttribute("aria-label", "digitando");
  t.innerHTML = "<i></i><i></i><i></i>";
  $msgs.appendChild(t); scrollDown();
  await wait(Math.min(1200, 450 + text.length * 9));
  t.remove();
  addMsg(text, "bot");
}

/* próximo passo ainda sem resposta (aplicando os pulos) */
function nextStep() {
  for (const s of STEPS) {
    if (answers[s.id] !== undefined) continue;
    if (s.skip && s.skip(answers)) { answers[s.id] = s.skipValue; continue; }
    return s;
  }
  return null;
}
function progress() {
  const answered = STEPS.filter(s => answers[s.id] !== undefined).length;
  const pct = done ? 100 : Math.round(answered / STEPS.length * 100);
  $bar.style.width = pct + "%";
  $bar.parentElement.setAttribute("aria-valuenow", pct);
  $back.hidden = done || !STEPS.some(s => answers[s.id] !== undefined && !(s.skip && s.skip(answers)));
}

/* redesenha a conversa já respondida (usado ao voltar) */
function rebuild() {
  $msgs.innerHTML = "";
  addMsg(INTRO, "bot", true);
  for (const s of STEPS) {
    if (answers[s.id] === undefined) break;
    if (s.skip && s.skip(answers)) continue;
    addMsg(s.q, "bot", true);
    addMsg(s.form ? answers.nome : answers[s.id], "user", true);
  }
}

async function ask() {
  const s = nextStep();
  progress();
  if (!s) return;
  busy = true; $dock.innerHTML = "";
  await botSays(s.q);
  busy = false;
  s.form ? renderForm(s) : renderOpts(s);
}

const svg = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
const ARROW = svg('<path d="M5 12h14M13 6l6 6-6 6" stroke-width="2.4"/>');
const HAND = svg('<path d="M12 5v14M6 13l6 6 6-6" stroke-width="2.4"/>');

function renderOpts(s) {
  $dock.innerHTML = '<p class="hint">' + HAND + "Toque em uma opção</p>" +
    '<div class="opts' + (s.one ? " one" : "") + '" role="group" aria-label="Opções de resposta">' +
    s.opts.map((o, i) => '<button class="opt" type="button" style="--i:' + i + '"><span class="oi">' + svg(ICONS[o] || ICONS["Outro"]) + '</span><span class="ot">' + esc(o) + '</span><span class="oa">' + ARROW + "</span></button>").join("") + "</div>";
  const group = $dock.querySelector(".opts");
  $dock.querySelectorAll(".opt").forEach((b, i) => b.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    b.classList.add("picked"); group.classList.add("has-pick");
    await wait(280);
    busy = false;
    answers[s.id] = s.opts[i];
    addMsg(s.opts[i], "user");
    ask();
  }));
}

/* WhatsApp com máscara brasileira: (11) 91234-5678 */
const maskPhone = v => {
  const d = v.replace(/\D/g, "").replace(/^55(?=\d{10,11}$)/, "").slice(0, 11);
  if (d.length <= 2) return d.length ? "(" + d : "";
  if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
  if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
  return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
};

function renderForm() {
  $dock.innerHTML =
    '<form class="form" id="lead" novalidate>' +
    '<div class="field"><label for="nome">Seu nome</label><input id="nome" name="nome" autocomplete="name" autocapitalize="words" enterkeyhint="next" placeholder="Seu nome" aria-label="Seu nome" required><div class="err" id="e-nome"></div></div>' +
    '<div class="field"><label for="empresa">Empresa</label><input id="empresa" name="empresa" autocomplete="organization" autocapitalize="words" enterkeyhint="next" placeholder="Nome da empresa" aria-label="Nome da empresa" required><div class="err" id="e-empresa"></div></div>' +
    '<div class="field"><label for="whats">WhatsApp</label><input id="whats" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel-national" enterkeyhint="send" placeholder="WhatsApp com DDD" aria-label="WhatsApp com DDD" required><div class="err" id="e-whats"></div></div>' +
    '<button class="send" type="submit">Enviar <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>' +
    '<p class="legal">Ao enviar, você autoriza a 2!H a usar estes dados para entrar em contato pelo WhatsApp, conforme a <a href="/novo/privacidade/" target="_blank" rel="noopener">política de privacidade</a>.</p>' +
    "</form>";
  const f = document.getElementById("lead"), nome = f.nome, empresa = f.empresa, whats = f.whats;
  whats.addEventListener("input", () => { whats.value = maskPhone(whats.value); });
  nome.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); empresa.focus(); } });
  empresa.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); whats.focus(); } });
  setTimeout(() => { if (matchMedia("(hover:hover)").matches) nome.focus(); }, 50);
  f.addEventListener("submit", e => {
    e.preventDefault();
    const n = nome.value.trim().replace(/\s+/g, " "), emp = empresa.value.trim().replace(/\s+/g, " "), digits = whats.value.replace(/\D/g, "");
    let ok = true;
    const setErr = (input, id, msg) => { document.getElementById(id).textContent = msg; input.setAttribute("aria-invalid", msg ? "true" : "false"); if (msg) ok = false; };
    setErr(nome, "e-nome", n.length < 2 ? "Digite seu nome." : "");
    setErr(empresa, "e-empresa", emp.length < 2 ? "Digite o nome da empresa." : "");
    setErr(whats, "e-whats", !/^\d{2}9?\d{8}$/.test(digits) ? "Digite um WhatsApp com DDD, ex.: (11) 91234-5678." : "");
    if (!ok) { (n.length < 2 ? nome : emp.length < 2 ? empresa : whats).focus(); return; }
    finish(n, emp, whats.value);
  });
}

async function finish(nome, empresa, whats) {
  answers.contato = true; answers.nome = nome; answers.empresa = empresa; answers.whatsapp = whats;
  const status = classify(answers);
  done = true; busy = true;
  $dock.innerHTML = "";
  addMsg(nome + " · " + empresa + " · " + whats, "user");
  progress();
  const payload = {
    data_hora: new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" }),
    source: "diagnostico-rapido", formulario: "diagnostico-rapido",
    nome, empresa, whatsapp: whats, whatsapp_digitos: "55" + whats.replace(/\D/g, ""),
    cargo: answers.cargo, segmento: answers.segmento, faturamento: answers.faturamento, investe_marketing: answers.investe,
    transparencia: answers.transparencia, gargalo: answers.gargalo, status, prioridade: prioridade(answers),
    consentimento_contato: true, enviado_em: new Date().toISOString(),
    ...origin, pagina: location.origin + location.pathname
  };
  send(payload);
  (window.dataLayer = window.dataLayer || []).push({ event: "diagnostico_rapido", status, prioridade: payload.prioridade, faturamento: answers.faturamento });
  const t = document.createElement("div");
  t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
  $msgs.appendChild(t); scrollDown();
  await wait(1100);
  t.remove();
  const card = document.createElement("div");
  card.className = "result" + (FINAL[status].out ? " out" : "");
  card.innerHTML = '<span class="tag">' + esc(FINAL[status].tag) + "</span><p>" + esc(FINAL[status].text(firstName(nome))) + "</p>";
  $msgs.appendChild(card); scrollDown();
  busy = false;
  let html = "";
  if (status === "QUALIFICADO" && CONFIG.WHATSAPP_COMERCIAL) {
    const msg = "Olá! Sou " + nome + ", da " + empresa + ". Acabei de responder o diagnóstico da 2!H e quero agendar a conversa.";
    html += '<a class="send" href="https://wa.me/' + CONFIG.WHATSAPP_COMERCIAL.replace(/\D/g, "") + "?text=" + encodeURIComponent(msg) + '" target="_blank" rel="noopener">Chamar no WhatsApp agora</a>';
  }
  if (status === "FORA DO ICP" && CONFIG.CONTENT_URL) html +='<a class="send" href="' + esc(CONFIG.CONTENT_URL) + '" rel="noopener">' + esc(CONFIG.CONTENT_LABEL) + "</a>";
  html += '<button class="alt" type="button" id="redo">Refazer as respostas</button>';
  $dock.innerHTML = html;
  document.getElementById("redo").addEventListener("click", restart);
}

/* envio para o n8n. Tenta JSON; se o CORS bloquear, manda sem preflight; se cair a rede, guarda e reenvia na próxima visita. */
function send(data) {
  if (!CONFIG.WEBHOOK_URL) { console.warn("[2!H] WEBHOOK_URL vazio: lead não foi salvo.", data); return; }
  const body = JSON.stringify(data);
  const guardar = () => { try { const q = JSON.parse(localStorage.getItem("2h_fila") || "[]"); q.push(data); localStorage.setItem("2h_fila", JSON.stringify(q)); } catch (_) {} };
  fetch(CONFIG.WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true })
    .then(r => { if (!r.ok) throw 0; })
    .catch(() => fetch(CONFIG.WEBHOOK_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body, keepalive: true }).catch(guardar));
}
(function flushQueue() {
  if (!CONFIG.WEBHOOK_URL) return;
  let q = [];
  try { q = JSON.parse(localStorage.getItem("2h_fila") || "[]"); localStorage.removeItem("2h_fila"); } catch (_) { return; }
  q.forEach(send);
})();

function goBack() {
  if (busy || done) return;
  const answered = STEPS.filter(s => answers[s.id] !== undefined && !(s.skip && s.skip(answers)));
  const last = answered[answered.length - 1];
  if (!last) return;
  // apaga a última resposta e tudo que veio depois (inclusive perguntas puladas)
  STEPS.slice(STEPS.indexOf(last)).forEach(s => delete answers[s.id]);
  rebuild();
  const s = nextStep();
  progress();
  addMsg(s.q, "bot", true);
  s.form ? renderForm(s) : renderOpts(s);
}
$back.addEventListener("click", goBack);

function restart() {
  answers = {}; done = false; busy = false;
  $msgs.innerHTML = ""; $dock.innerHTML = "";
  start();
}
async function start() {
  progress();
  busy = true;
  await botSays(INTRO);
  busy = false;
  ask();
}
start();
</script>
<script>/* >>> PADRAO-PROTECAO-JS */
/* proteção de conteúdo: sem clique direito, sem arrastar, sem copiar e sem Ctrl+S / Ctrl+U.
   Dentro de campos de formulário tudo continua liberado. */
(function protecao() {
  const campo = el => el && el.closest && el.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"])');
  const bloqueia = e => { if (!campo(e.target) && !campo(document.activeElement)) e.preventDefault(); };
  document.addEventListener("contextmenu", e => { if (!campo(e.target)) e.preventDefault(); });
  document.addEventListener("dragstart", e => { if (!campo(e.target)) e.preventDefault(); });
  document.addEventListener("selectstart", e => { if (!campo(e.target)) e.preventDefault(); });
  document.addEventListener("copy", bloqueia);
  document.addEventListener("cut", bloqueia);
  document.addEventListener("keydown", e => {
    const k = (e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === "s" || k === "u")) e.preventDefault();
  });
})();
</script>
